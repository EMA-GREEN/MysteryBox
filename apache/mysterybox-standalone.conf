# Standalone Apache Configuration for MysteryBox
# This includes minimal required modules and settings
# Place at: /etc/httpd/conf/mysterybox-standalone.conf

# Server root (adjust if your Apache is installed elsewhere)
ServerRoot /etc/httpd

# Pid file
PidFile /var/run/httpd/mysterybox.pid

# Load required modules
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule php_module modules/libphp.so

# If using PHP-FPM, comment out the php_module line above and uncomment:
#LoadModule proxy_module modules/mod_proxy.so
#LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

# User and Group
User apache
Group apache

# Listen on port 8285
Listen 8285

# MIME types
TypesConfig /etc/mime.types

# Default document
DirectoryIndex index.php index.html

# Logging
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
ErrorLog /var/log/httpd/mysterybox_error.log
CustomLog /var/log/httpd/mysterybox_access.log combined

# Virtual Host
<VirtualHost *:8285>
    ServerName 188.64.189.38
    DocumentRoot /var/www/html/MysteryBox/public

    <Directory /var/www/html/MysteryBox/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP handler (mod_php)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # PHP-FPM handler (uncomment if using PHP-FPM instead of mod_php)
    #<FilesMatch \.php$>
    #    SetHandler "proxy:unix:/var/run/php-fpm/mysterybox.sock|fcgi://localhost"
    #</FilesMatch>

    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</VirtualHost>

