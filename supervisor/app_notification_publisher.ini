[program:app_notification_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan app:publish-notifications
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/app_notification_publisher.log
stopwaitsecs=3600