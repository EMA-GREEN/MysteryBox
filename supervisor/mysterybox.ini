[program:mysterybox]
process_name=%(program_name)s
# Using Apache instead of php artisan serve for production stability
# php artisan serve is single-threaded and causes connection issues

# Option 1: Standalone Apache config (includes all modules)
#command=/usr/sbin/httpd -DFOREGROUND -f /etc/httpd/conf/mysterybox-standalone.conf

# Option 2: Use main httpd.conf and include vhost (uncomment if Option 1 doesn't work)
command=/usr/sbin/httpd -DFOREGROUND

# Option 3: Fallback to artisan serve (uncomment if Apache setup fails)
#command=php /var/www/html/MysteryBox/artisan serve --host=0.0.0.0 --port=8285

directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/httpd/mysterybox.log
stderr_logfile=/var/log/httpd/mysterybox_error.log
stopwaitsecs=10
stopasgroup=true
killasgroup=true
