[program:renewal_payment_low_priority_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan mysterybox:renewal:payment-low-priority-publish
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/renewal_payment_low_priority_publisher.log
stopwaitsecs=3600