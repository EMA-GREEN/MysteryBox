[program:mpush_subs_init_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan mpush:consume-subs-init --consumer-id=%(process_num)02d
autostart=true
autorestart=true
user=apache
numprocs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mpush-subs-init-consumer.log
stopwaitsecs=3600
