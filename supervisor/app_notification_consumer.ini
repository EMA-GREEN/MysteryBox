[program:app_notification_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan app:consume-notifications --consumer-id=%(process_num)02d
autostart=true
autorestart=true
user=apache
numprocs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/app-notification-consumer.log
stopwaitsecs=3600 