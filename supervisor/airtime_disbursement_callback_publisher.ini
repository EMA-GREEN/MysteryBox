[program:airtime_disbursement_callback_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan disbursement:callback:publish --type=airtime
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/airtime_disbursement_callback_publisher.log
stopwaitsecs=3600
