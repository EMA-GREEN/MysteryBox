[program:airtime_disbursement_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan airtime:disburse-publish
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/airtime_disbursement_publisher.log
stopwaitsecs=3600 