[program:payment_notification_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan payment:notify-publish
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/payment_notification_publisher.log
stopwaitsecs=3600 