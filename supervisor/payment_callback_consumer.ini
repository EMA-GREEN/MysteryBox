[program:payment_callback_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan payment:callback:consume --consumer-id=%(process_num)s
autostart=true
autorestart=true
user=apache
numprocs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/payment-callback-consumer.log
stopwaitsecs=3600 