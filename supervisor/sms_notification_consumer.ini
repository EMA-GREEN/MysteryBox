[program:sms_notification_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan sms:consume-notifications
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sms_notification_consumer.log
stopwaitsecs=3600 