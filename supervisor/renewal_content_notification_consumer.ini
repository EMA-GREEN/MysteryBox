[program:renewal_content_notification_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan renewal:content-notification-consumer
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/renewal_content_notification_consumer.log
stopwaitsecs=3600