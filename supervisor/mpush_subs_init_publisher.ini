[program:mpush_subs_init_publisher]
process_name=%(program_name)s
command=php /var/www/html/MysteryBox/artisan mpush:publish-subs-init
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mpush_subs_init_publisher.log
stopwaitsecs=3600
