[program:renewal_payment_priority_consumer]
process_name=%(program_name)s_%(process_num)s
command=php /var/www/html/MysteryBox/artisan mysterybox:renewal:payment-priority-consume
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=40
redirect_stderr=true
stdout_logfile=/var/log/supervisor/renewal_payment_priority_consumer.log
stopwaitsecs=3600