[program:renewal_payment_callback_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan renewal:payment-callback-consumer
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=15
redirect_stderr=true
stdout_logfile=/var/log/supervisor/renewal_payment_callback_consumer.log
stopwaitsecs=3600