[program:payment_notification_consumer]
process_name=%(program_name)s_%(process_num)s
command=php /var/www/html/MysteryBox/artisan payment:notify-consume
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/payment_notification_consumer.log
stopwaitsecs=3600 