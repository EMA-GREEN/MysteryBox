[program:airtime_disbursement_callback_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan airtime:disbursement-callback:consume --consumer-id=%(process_num)02d
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/airtime_disbursement_callback_consumer.log
stopwaitsecs=3600
