# Apache VirtualHost Include Configuration for MysteryBox
# This file should be included in your main httpd.conf
# Place at: /etc/httpd/conf.d/mysterybox.conf
# (Files in conf.d are auto-included by default)

Listen 8285

<VirtualHost *:8285>
    ServerName 188.64.189.38
    DocumentRoot /var/www/html/MysteryBox/public

    <Directory /var/www/html/MysteryBox/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP handler (mod_php)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # PHP-FPM handler (uncomment if using PHP-FPM instead of mod_php)
    #<FilesMatch \.php$>
    #    SetHandler "proxy:unix:/var/run/php-fpm/mysterybox.sock|fcgi://localhost"
    #</FilesMatch>

    # Logging
    ErrorLog /var/log/httpd/mysterybox_error.log
    CustomLog /var/log/httpd/mysterybox_access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</VirtualHost>

