# Apache Configuration for MysteryBox Laravel Application
# 
# FILE PLACEMENT OPTIONS:
# 
# Option 1: Place in /etc/httpd/conf.d/mysterybox.conf (RECOMMENDED)
#   - Files in conf.d/ are automatically included by main httpd.conf
#   - Use this when Apache is managed by systemd/service (standard setup)
#   - Command: sudo cp apache/mysterybox.conf /etc/httpd/conf.d/mysterybox.conf
#   - After copying: sudo httpd -t && sudo systemctl reload httpd
#   - Note: Alternatively use mysterybox-include.conf which includes PHP handler
#
# Option 2: Place in /etc/httpd/conf/mysterybox.conf (for manual include)
#   - Only if you manually include it in main httpd.conf with: Include conf/mysterybox.conf
#   - Or if using standalone Apache instance managed by supervisor
#   - Command: sudo cp apache/mysterybox.conf /etc/httpd/conf/mysterybox.conf
#   - Then add to /etc/httpd/conf/httpd.conf: Include conf/mysterybox.conf
#
# IMPORTANT NOTES:
# - This file does NOT include PHP handler configuration
# - If using mod_php, add: <FilesMatch \.php$> SetHandler application/x-httpd-php </FilesMatch>
# - For PHP-FPM, use proxy_fcgi handler instead
# - For a complete config with PHP handler, use mysterybox-include.conf instead

Listen 8285

<VirtualHost *:8285>
    ServerName 188.64.189.38
    DocumentRoot /var/www/html/MysteryBox/public

    <Directory /var/www/html/MysteryBox/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP handler (mod_php) - REQUIRED for Laravel
    # Uncomment the appropriate handler based on your PHP setup:
    
    # For mod_php (most common):
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    
    # For PHP-FPM (uncomment if using PHP-FPM instead of mod_php):
    #<FilesMatch \.php$>
    #    SetHandler "proxy:unix:/var/run/php-fpm/mysterybox.sock|fcgi://localhost"
    #</FilesMatch>

    # Logging
    ErrorLog /var/log/httpd/mysterybox_error.log
    CustomLog /var/log/httpd/mysterybox_access.log combined

    # Note: Global performance tuning (MaxRequestWorkers, ServerLimit, etc.)
    # should be configured in the main httpd.conf, not inside this vhost.

    # Security headers (optional)
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</VirtualHost>

