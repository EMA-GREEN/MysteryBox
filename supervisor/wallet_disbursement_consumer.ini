[program:wallet_disbursement_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan wallet:disburse-consume --consumer-id=%(process_num)s
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=root
numprocs=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wallet_disbursement_consumer.log
stopwaitsecs=3600 