[program:mobile_money_transaction_consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/MysteryBox/artisan mobile-money-transaction:consume-notifications
directory=/var/www/html/MysteryBox
autostart=true
autorestart=true
user=apache
numprocs=150
redirect_stderr=true
stdout_logfile=/var/log/supervisor/mobile_money_transaction_consumer.log
stopwaitsecs=3600 